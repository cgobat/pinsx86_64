name: Build Single Debian Package (Reusable)

on:
  workflow_call:
    inputs:
      package_key:
        description: Package key to build
        required: true
        type: string

concurrency:
  group: build-single-package-${{ inputs.package_key }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_CONFIGURATION: Release
  TARGET_RUNTIME: linux-x64
  PLUGIN_TARGET_FRAMEWORK: net10.0
  INSTALL_DIRECTORY: /home/ubuntu/pins
  PUBLISH_DIRECTORY: artifacts/publish
  PACKAGE_ROOT: artifacts/package
  DEB_ROOT: artifacts/debroot
  DEB_ARCH: amd64
  DEB_PACKAGE: pins
  PLUGINS_INSTALL_BASE: /home/ubuntu/.local/share/NINA/Plugins/3.0.0
  PLUGIN_DEB_BASE: artifacts/plugin-debroot
  PLUGIN_ARTIFACT_DIR: artifacts/plugins
  PLUGIN_MSBUILD_ARGS: -p:DisableImplicitSystemDrawingReference=true -p:Platform=AnyCPU -p:PlatformTarget=AnyCPU -p:SatelliteResourceLanguages="en-US"
  INDI_ENABLE_XISF: true
  LIBXISF_AUTO_UPGRADE_IF_OLD: true
  LIBXISF_REPO_URL: https://github.com/joxda/libXISF.git
  LIBXISF_BRANCH: master
  LIBXISF_INSTALL_PREFIX: /usr/local
  PHD2_REPO_URL: https://github.com/acocalypso/phd2.git
  PHD2_BRANCH: master
  PHD2_INDI_VERSION: 2.1.9
  PHD2_OPENCV_VERSION: 4.11.0
  PHD2_BUILD_INDI_3RDPARTY: true
  PHD2_INDI_ROOT: /usr
  OPENCV_REQUIRED_VERSION: 4.11.0
  OPENCV_SOURCE_ROOT: artifacts/src/opencv
  OPENCV_INSTALL_PREFIX: /usr/local
  OPENCV_EXTRA_MODULES: true

jobs:
  build:
    name: Build package ${{ inputs.package_key }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Bootstrap container tooling
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            gnupg \
            wget \
            default-jre-headless \
            build-essential \
            cmake \
            git-lfs \
            zip \
            unzip \
            autoconf \
            autoconf-archive \
            libtool \
            pkg-config \
            libudev-dev \
            libjsoncpp-dev \
            libssl-dev \
            libicu-dev \
            rsync

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false

      - name: Update submodules (excluding NINA/External)
        shell: bash
        run: |
          set -euo pipefail
          git lfs install

          excluded_path="NINA/External"
          while IFS= read -r key; do
            path="$(git config -f .gitmodules --get "$key" || true)"
            path="${path//$'\r'/}"
            path="${path#${path%%[![:space:]]*}}"
            path="${path%${path##*[![:space:]]}}"

            if [ -z "$path" ]; then
              echo "Skipping submodule entry with empty path for key: $key" >&2
              continue
            fi

            if [ "$path" = "$excluded_path" ]; then
              echo "Skipping submodule $path"
              continue
            fi

            echo "Updating submodule $path"
            if git submodule update --init --recursive --remote "$path"; then
              continue
            fi

            echo "Remote update failed for $path; falling back to pinned commit" >&2
            git submodule update --init --recursive "$path"
          done < <(git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path$' || true)

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/global.json', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Determine release and build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          ci_build_number=$((GITHUB_RUN_NUMBER + 299))
          release_date=$(date +%d%m%Y)
          release_tag="${{ inputs.package_key }}-v${release_date}-${ci_build_number}"

          echo "CI_BUILD_NUMBER=$ci_build_number" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=$release_date" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

          echo "ci_build_number=$ci_build_number" >> "$GITHUB_OUTPUT"
          echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Prepare core linux-x64 publish payload
        if: ${{ inputs.package_key == 'pins' || startsWith(inputs.package_key, 'plugin-') }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y libudev-dev libjsoncpp-dev autoconf autoconf-archive libtool pkg-config

          wget https://mirrors.edge.kernel.org/pub/software/libs/libgpiod/libgpiod-2.2.tar.gz
          tar -xzf libgpiod-2.2.tar.gz
          cd libgpiod-2.2
          ./configure --prefix=/usr --enable-tools=yes --enable-bindings-cxx
          make
          sudo make install
          sudo ldconfig
          cd ..

          rm -rf NINA/External
          git clone --depth 1 --branch main https://github.com/nitr57/pins.external NINA/External
          pushd NINA/External >/dev/null
          git lfs pull || true
          if [ -f .gitmodules ]; then
            git submodule sync --recursive || true
            git submodule update --init --recursive
          fi
          popd >/dev/null

          jpleph_url="https://github.com/isbeorn/nina.external/raw/refs/heads/master/JPLEPH"
          curl -L --fail --retry 3 --retry-delay 5 -o "NINA/External/JPLEPH" "$jpleph_url"

          rm -f "NINA/External/.gitignore" "NINA/External/.gitattributes"

          if [ ! -d "NINA/External/${TARGET_RUNTIME}" ]; then
            echo "NINA/External/${TARGET_RUNTIME} not found after repository clone" >&2
            exit 1
          fi

          # Rebuild NOVAS from source (prefer sources in pins.external clone).
          novas_source_dir=""
          if [ -d "NINA/External/NOVAS31" ]; then
            novas_source_dir="NINA/External/NOVAS31"
          elif [ -d "NOVAS31" ]; then
            novas_source_dir="NOVAS31"
          else
            echo "NOVAS31 source directory not found in NINA/External or workspace root." >&2
            ls -la NINA/External || true
            exit 1
          fi

          pushd "$novas_source_dir" >/dev/null
          make clean || true
          make
          popd >/dev/null

          mkdir -p "NINA/External/${TARGET_RUNTIME}/NOVAS"
          cp -f "$novas_source_dir/libnovas_c.so" "NINA/External/${TARGET_RUNTIME}/NOVAS/libnovas_c.so"
          cp -f "$novas_source_dir/cio_ra.bin" "NINA/External/${TARGET_RUNTIME}/NOVAS/cio_ra.bin"

          if [ ! -f "NINA/External/JPLEPH" ]; then
            echo "NINA/External/JPLEPH not found" >&2
            exit 1
          fi

          # Rebuild SOFA from source (prefer sources in pins.external clone).
          sofa_source_dir=""
          if [ -d "NINA/External/SOFA/SOFA/src" ]; then
            sofa_source_dir="NINA/External/SOFA/SOFA/src"
          elif [ -d "SOFA/SOFA/src" ]; then
            sofa_source_dir="SOFA/SOFA/src"
          else
            echo "SOFA source directory not found in NINA/External or workspace root." >&2
            ls -la NINA/External || true
            exit 1
          fi

          pushd "$sofa_source_dir" >/dev/null
          make clean || true
          make
          rm -f ./*.o libsofa_c.so
          for src in ./*.c; do
            if [ "$(basename "$src")" = "t_sofa_c.c" ]; then
              continue
            fi
            gcc -fPIC -O2 -c "$src"
          done
          gcc -shared -o libsofa_c.so ./*.o -lm
          popd >/dev/null

          mkdir -p "NINA/External/${TARGET_RUNTIME}/SOFA"
          cp -f "$sofa_source_dir/libsofa_c.so" "NINA/External/${TARGET_RUNTIME}/SOFA/libsofa_c.so"

          # Keep only NOVAS and SOFA under the runtime-specific external folder.
          find "NINA/External/${TARGET_RUNTIME}" -mindepth 1 -maxdepth 1 ! -name 'NOVAS' ! -name 'SOFA' -exec rm -rf {} +

          dotnet restore NINA/NINA.csproj -r "${TARGET_RUNTIME}"
          dotnet restore System.Windows.Compat/System.Windows.Compat.csproj

          runtime_version=$(sed -n 's/.*OpenCvSharp4\.official\.runtime\.\$(RuntimeIdentifier)" Version="\([^"]*\)".*/\1/p' NINA/NINA.csproj | head -n 1)
          if [ -z "$runtime_version" ]; then
            echo "Could not parse OpenCvSharp runtime package version from NINA/NINA.csproj" >&2
            exit 1
          fi

          nuget_global_packages=$(dotnet nuget locals global-packages --list | sed -n 's/^global-packages: //p' | head -n 1)
          if [ -z "$nuget_global_packages" ]; then
            echo "Could not determine NuGet global-packages path" >&2
            exit 1
          fi

          package_so="$nuget_global_packages/opencvsharp4.official.runtime.linux-x64/$runtime_version/runtimes/linux-x64/native/libOpenCvSharpExtern.so"
          if [ ! -f "$package_so" ]; then
            echo "OpenCvSharp runtime not in cache after restore, retrying restore" >&2
            dotnet restore NINA/NINA.csproj -r "${TARGET_RUNTIME}"
          fi

          if [ ! -f "$package_so" ]; then
            echo "OpenCvSharp runtime library not found: $package_so" >&2
            exit 1
          fi

          mkdir -p "NINA/External/${TARGET_RUNTIME}"
          cp -f "$package_so" "NINA/External/${TARGET_RUNTIME}/libOpenCvSharpExtern.so"
          chmod 755 "NINA/External/${TARGET_RUNTIME}/libOpenCvSharpExtern.so"

          dotnet build System.Windows.Compat/System.Windows.Compat.csproj -c "${BUILD_CONFIGURATION}" --no-restore
          dotnet build NINA/NINA.csproj -c "${BUILD_CONFIGURATION}" -r "${TARGET_RUNTIME}" --no-restore
          dotnet publish NINA/NINA.csproj -c "${BUILD_CONFIGURATION}" -r "${TARGET_RUNTIME}" --no-build -o "${PUBLISH_DIRECTORY}/${TARGET_RUNTIME}"

          publish_root="${PUBLISH_DIRECTORY}/${TARGET_RUNTIME}"
          mkdir -p "$publish_root/External"
          rsync -a NINA/External/ "$publish_root/External/"

      - name: Build selected package
        id: build
        shell: bash
        run: |
          set -euo pipefail

          package_key="${{ inputs.package_key }}"
          mkdir -p artifacts "${PLUGIN_ARTIFACT_DIR}"
          : > artifacts/release-files.txt

          get_core_version() {
            local base_version
            base_version=$(grep -m1 'AssemblyInformationalVersion' CommonAssemblyInfo.cs | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "$base_version" ]; then
              echo "Failed to determine version from CommonAssemblyInfo.cs" >&2
              return 1
            fi
            base_version=$(echo "$base_version" | sed 's/-canary/-pins-canary/')
            echo "${base_version}+${CI_BUILD_NUMBER}"
          }

          build_pins_package() {
            local package_version
            package_version=$(get_core_version)
            local target_user="${SUDO_USER:-$USER}"
            local host_multiarch
            host_multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH 2>/dev/null || true)"

            publish_root="${PUBLISH_DIRECTORY}/${TARGET_RUNTIME}"
            package_root="${PACKAGE_ROOT}"
            rm -rf "$package_root"
            mkdir -p "$package_root/pins"
            rsync -a "$publish_root/" "$package_root/pins/"
            echo "${INSTALL_DIRECTORY}" > "$package_root/pins/.install_path"

            compat_dll="System.Windows.Compat/bin/${BUILD_CONFIGURATION}/net10.0/System.Windows.dll"
            if [ ! -f "$compat_dll" ]; then
              echo "Compat build missing at $compat_dll" >&2
              return 1
            fi
            cp -f "$compat_dll" "$package_root/pins/System.Windows.dll"

            deb_root="${DEB_ROOT}"
            install_root="$deb_root/${INSTALL_DIRECTORY#/}"
            rm -rf "$deb_root"
            mkdir -p "$install_root"
            rsync -a "$package_root/pins/" "$install_root/"

            service_path="$deb_root/etc/systemd/system/pins.service"
            mkdir -p "$(dirname "$service_path")"
            cp packaging/systemd/pins.service "$service_path"
            sed -i \
              -e "s|/home/pi/pins|${INSTALL_DIRECTORY}|g" \
              -e "s|User=pi|User=${target_user}|g" \
              -e "s|Group=pi|Group=${target_user}|g" \
              "$service_path"
            if [ -n "$host_multiarch" ]; then
              sed -i -e "s|aarch64-linux-gnu|$host_multiarch|g" "$service_path"
            fi
            chmod 644 "$service_path"

            control_dir="$deb_root/DEBIAN"
            mkdir -p "$control_dir"
            cp packaging/debian/postinst "$control_dir/postinst"
            cp packaging/debian/prerm "$control_dir/prerm"
            sed -i \
              -e "s|chown -R pi:pi|chown -R ${target_user}:${target_user}|g" \
              -e "s|chown pi:pi|chown ${target_user}:${target_user}|g" \
              -e "s|/home/pi/pins|${INSTALL_DIRECTORY}|g" \
              "$control_dir/postinst"
            chmod 755 "$control_dir/postinst" "$control_dir/prerm"

            installed_size=$(du -sk "$install_root" | cut -f1)
            {
              echo "Package: ${DEB_PACKAGE}"
              echo "Version: ${package_version}"
              echo "Section: misc"
              echo "Priority: optional"
              echo "Architecture: ${DEB_ARCH}"
              echo "Maintainer: PINS Team"
              echo "Installed-Size: ${installed_size}"
              echo "Description: Pins build for Ubuntu 24 x64"
            } > "$control_dir/control"

            deb_path="artifacts/${DEB_PACKAGE}_${package_version}_${DEB_ARCH}_${RELEASE_DATE}.deb"
            dpkg-deb --root-owner-group --build "$deb_root" "$deb_path"
            sha256sum "$deb_path" > "$deb_path.sha256"

            echo "$deb_path" >> artifacts/release-files.txt
            echo "$deb_path.sha256" >> artifacts/release-files.txt
          }

          build_pinsdaemon_package() {
            local target_user="${SUDO_USER:-$USER}"
            rm -rf pinsdaemon
            git clone https://github.com/Touch-N-Stars/pinsdaemon pinsdaemon

            pushd pinsdaemon >/dev/null
            mkdir -p build/opt/pinsdaemon
            mkdir -p build/usr/local/bin
            mkdir -p build/etc/systemd/system
            mkdir -p build/etc/NetworkManager/dispatcher.d
            mkdir -p build/etc/sudoers.d
            mkdir -p build/home/$target_user/pins-scripts
            mkdir -p build/lib/udev/rules.d
            mkdir -p build/DEBIAN

            cp -r app build/opt/pinsdaemon/
            cp requirements.txt build/opt/pinsdaemon/
            cp README.md build/opt/pinsdaemon/

            cp scripts/system-upgrade.sh build/usr/local/bin/
            cp scripts/manage-samba.sh build/usr/local/bin/
            cp scripts/wifi-connect.sh build/usr/local/bin/
            cp scripts/wifi-automanage.py build/usr/local/bin/
            cp scripts/wifi-scan.py build/usr/local/bin/
            cp scripts/install-firmware.sh build/usr/local/bin/
            cp scripts/install-indi-package.sh build/usr/local/bin/
            cp scripts/ensure-required-packages.sh build/usr/local/bin/
            cp scripts/manage-plugin.sh build/usr/local/bin/


            cp scripts/hotspot.sh build/home/$target_user/pins-scripts/
            cp scripts/90-pins-wifi-recovery build/etc/NetworkManager/dispatcher.d/
            chmod 755 build/etc/NetworkManager/dispatcher.d/90-pins-wifi-recovery

            cp systemd/sysupdate-api.service build/etc/systemd/system/
            cp packaging/zz-pins.rules build/lib/udev/rules.d/zz-pins.rules
            cp packaging/sudoers build/etc/sudoers.d/sysupdate-api

            cp packaging/DEBIAN/* build/DEBIAN/
            chmod 755 build/DEBIAN/postinst
            chmod 755 build/DEBIAN/prerm

            base_version=$(grep '^Version:' packaging/DEBIAN/control | awk '{print $2}')
            full_version="${base_version}-${CI_BUILD_NUMBER}"
            filename="pinsdaemon_${full_version}_amd64.deb"

            sed -i "s/^Version:.*/Version: ${full_version}/" build/DEBIAN/control
            dpkg-deb --root-owner-group --build build "$filename"
            popd >/dev/null

            mv "pinsdaemon/${filename}" artifacts/
            echo "artifacts/${filename}" >> artifacts/release-files.txt
          }

          build_cmake_sdk_package() {
            local repo_url="$1"
            local repo_dir="$2"
            local deb_package="$3"
            local package_description="$4"

            local sdk_version
            sdk_version=$(get_core_version)

            rm -rf "$repo_dir"
            git clone --depth 1 "$repo_url" "$repo_dir"

            pushd "$repo_dir" >/dev/null
            mkdir -p build
            cd build
            cmake ..
            make -j"$(nproc)"
            popd >/dev/null

            local deb_root
            deb_root="artifacts/${deb_package}-debroot"
            local install_root
            install_root="$deb_root/usr/lib"
            local control_dir
            control_dir="$deb_root/DEBIAN"

            rm -rf "$deb_root"
            mkdir -p "$install_root" "$control_dir"

            mapfile -t lib_files < <(find "$repo_dir/build" -type f \( -name 'lib*.so' -o -name 'lib*.so.*' \))
            if [ ${#lib_files[@]} -eq 0 ]; then
              echo "No shared library files found under ${repo_dir}/build" >&2
              return 1
            fi

            cp -a "${lib_files[@]}" "$install_root/"

            local installed_size
            installed_size=$(du -sk "$deb_root/usr" | cut -f1)
            {
              echo "Package: ${deb_package}"
              echo "Version: ${sdk_version}"
              echo "Section: libs"
              echo "Priority: optional"
              echo "Architecture: ${DEB_ARCH}"
              echo "Maintainer: PINS Team"
              echo "Installed-Size: ${installed_size}"
              echo "Description: ${package_description}"
            } > "$control_dir/control"

            {
              echo '#!/bin/sh'
              echo 'set -e'
              echo 'exit 0'
            } > "$control_dir/postinst"
            chmod 755 "$control_dir/postinst"

            local deb_path
            deb_path="artifacts/${deb_package}_${sdk_version}_${DEB_ARCH}_${RELEASE_DATE}.deb"
            dpkg-deb --root-owner-group --build "$deb_root" "$deb_path"
            sha256sum "$deb_path" > "$deb_path.sha256"

            echo "$deb_path" >> artifacts/release-files.txt
            echo "$deb_path.sha256" >> artifacts/release-files.txt
          }

          build_wanderercoversdk_package() {
            build_cmake_sdk_package \
              "https://github.com/nitr57/WandererCoverSDK.git" \
              "WandererCoverSDK" \
              "pins-wanderercoversdk" \
              "WandererCover SDK shared library package"
          }

          build_wandererrotatorsdk_package() {
            build_cmake_sdk_package \
              "https://github.com/nitr57/WandererRotatorSDK.git" \
              "WandererRotatorSDK" \
              "pins-wandererrotatorsdk" \
              "WandererRotator SDK shared library package"
          }

          build_nitecrawlersdk_package() {
            build_cmake_sdk_package \
              "https://github.com/nitr57/NitecrawlerSDK.git" \
              "NitecrawlerSDK" \
              "pins-nitecrawlersdk" \
              "Nitecrawler SDK shared library package"
          }

          build_wandereretasdk_package() {
            build_cmake_sdk_package \
              "https://github.com/nitr57/WandererETASDK.git" \
              "WandererETASDK" \
              "pins-wandereretasdk" \
              "WandererETA SDK shared library package"
          }

          clone_selected_plugin_repo() {
            rm -rf NINA.Plugins
            mkdir -p NINA.Plugins

            case "$package_key" in
              plugin-joko)
                git clone https://github.com/nitr57/joko.nina.plugins NINA.Plugins/joko.nina.plugins
                ;;
              plugin-orbitals)
                git clone https://github.com/nitr57/NINA.Joko.Plugin.Orbitals NINA.Plugins/NINA.Joko.Plugin.Orbitals
                ;;
              plugin-tenmicron)
                git clone https://github.com/nitr57/NINA.Joko.Plugin.TenMicron NINA.Plugins/NINA.Joko.Plugin.TenMicron
                ;;
              plugin-livestack)
                git clone https://github.com/nitr57/nina.plugin.livestack NINA.Plugins/LiveStack
                ;;
              plugin-ninaapi)
                git clone https://github.com/nitr57/ninaAPI NINA.Plugins/ninaAPI
                ;;
              plugin-orbuculum)
                git clone https://github.com/nitr57/nina.plugin.orbuculum NINA.Plugins/nina.plugin.orbuculum
                ;;
              plugin-phd2tools)
                git clone https://github.com/nitr57/nina.plugin.phd2tools NINA.Plugins/nina.plugin.phd2tools
                ;;
              plugin-groundstation)
                git clone https://github.com/nitr57/nina-ground-station NINA.Plugins/nina-ground-station
                ;;
              plugin-alpaca)
                git clone https://github.com/nitr57/nina.plugin.alpaca NINA.Plugins/nina.plugin.alpaca
                ;;
              plugin-nightsummary)
                git clone https://github.com/nitr57/nina.plugin.nightsummary NINA.Plugins/nina.plugin.nightsummary
                ;;
              plugin-polaralignment)
                git clone https://github.com/nitr57/nina.plugin.polaralignment NINA.Plugins/PolarAlignment
                ;;
              plugin-touch-n-stars)
                git clone --branch develop --single-branch https://github.com/nitr57/N.I.N.A-Plugin-for-Touch-N-Stars NINA.Plugins/Touch-N-Stars
                ;;
              plugin-pins)
                git clone https://github.com/nitr57/pins.plugin NINA.Plugins/pins.plugin
                ;;
              *)
                echo "Unknown plugin package key: $package_key" >&2
                return 1
                ;;
            esac
          }

          build_touch_frontend() {
            local plugin_dir="$1"
            local tmp_dir="$plugin_dir/frontend-build"

            rm -rf "$tmp_dir" "$plugin_dir/app"
            git clone --branch develop --single-branch https://github.com/Touch-N-Stars/Touch-N-Stars.git "$tmp_dir"
            pushd "$tmp_dir" >/dev/null
            npm install
            npm run build
            popd >/dev/null
            mv "$tmp_dir/dist" "$plugin_dir/app"
          }

          build_pins_sdks() {
            local plugin_dir_abs="$1"

            powerbox_sdk_tmp="$(mktemp -d)"
            git clone --recursive https://github.com/nitr57/pins.powerbox.sdk "$powerbox_sdk_tmp"
            pushd "$powerbox_sdk_tmp" >/dev/null
            mkdir -p build
            cd build
            cmake ..
            make
            mkdir -p "$plugin_dir_abs/extra-libs"
            find . -name 'libPowerBoxSDK.so' -exec cp {} "$plugin_dir_abs/extra-libs/PowerBoxSDK.dll" \;
            popd >/dev/null
            rm -rf "$powerbox_sdk_tmp"

            meteostation_sdk_tmp="$(mktemp -d)"
            git clone --recursive https://github.com/nitr57/pins.meteostation.sdk "$meteostation_sdk_tmp"
            pushd "$meteostation_sdk_tmp" >/dev/null
            mkdir -p build
            cd build
            cmake ..
            make
            mkdir -p "$plugin_dir_abs/extra-libs"
            find . -name 'libMeteoStationSDK.so' -exec cp {} "$plugin_dir_abs/extra-libs/MeteoStationSDK.dll" \;
            popd >/dev/null
            rm -rf "$meteostation_sdk_tmp"

            if [ ! -f "$plugin_dir_abs/extra-libs/PowerBoxSDK.dll" ]; then
              echo "CRITICAL: PowerBoxSDK.dll missing in extra-libs" >&2
              return 1
            fi
            if [ ! -f "$plugin_dir_abs/extra-libs/MeteoStationSDK.dll" ]; then
              echo "CRITICAL: MeteoStationSDK.dll missing in extra-libs" >&2
              return 1
            fi
          }

          build_plugin_package() {
            local project_path="$1"
            local install_folder="$2"
            local deb_package="$3"
            local assembly_regex="$4"
            local needs_touch_frontend="$5"
            local needs_pins_sdks="$6"

            local plugin_dir
            plugin_dir=$(dirname "$project_path")
            local plugin_dir_abs
            plugin_dir_abs="$(pwd)/$plugin_dir"

            if [ "$needs_touch_frontend" = "yes" ]; then
              build_touch_frontend "$plugin_dir"
            fi

            if [ "$needs_pins_sdks" = "yes" ]; then
              build_pins_sdks "$plugin_dir_abs"
            fi

            local assembly_info="$plugin_dir/Properties/AssemblyInfo.cs"
            if [ ! -f "$assembly_info" ]; then
              assembly_info=$(find "$plugin_dir" -name AssemblyInfo.cs | head -n 1)
            fi
            if [ -z "$assembly_info" ] || [ ! -f "$assembly_info" ]; then
              echo "AssemblyInfo.cs not found for ${deb_package}" >&2
              return 1
            fi

            local assembly_version_line
            if [ -n "$assembly_regex" ]; then
              assembly_version_line=$(grep -E "$assembly_regex" "$assembly_info" || true)
            else
              assembly_version_line=$(grep -E '^\s*\[assembly:\s*AssemblyVersion' "$assembly_info" || true)
            fi

            if [ -z "$assembly_version_line" ]; then
              assembly_version_line=$(grep -E 'AssemblyVersion' "$assembly_info" || true)
            fi

            local plugin_version
            plugin_version=$(echo "$assembly_version_line" | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "$plugin_version" ]; then
              echo "AssemblyVersion not found in $assembly_info" >&2
              return 1
            fi

            plugin_version="${plugin_version}+${CI_BUILD_NUMBER}"

            dotnet restore "$project_path" -r "${TARGET_RUNTIME}"
            JavaPath=$(which java) dotnet build "$project_path" -c "${BUILD_CONFIGURATION}" -f "${PLUGIN_TARGET_FRAMEWORK}" -r "${TARGET_RUNTIME}" --no-restore ${PLUGIN_MSBUILD_ARGS}

            tfm_dir="$plugin_dir/bin/${BUILD_CONFIGURATION}/${PLUGIN_TARGET_FRAMEWORK}/${TARGET_RUNTIME}"
            if [ ! -d "$tfm_dir" ]; then
              build_root="$plugin_dir/bin/${BUILD_CONFIGURATION}"
              tfm_dir=$(find "$build_root" -maxdepth 1 -type d -name 'net*' | head -n 1)
              if [ -z "$tfm_dir" ]; then
                echo "Could not locate target framework output under $build_root" >&2
                return 1
              fi
            fi

            deb_root="${PLUGIN_DEB_BASE}/${deb_package}"
            install_root="$deb_root${PLUGINS_INSTALL_BASE}/${install_folder}"
            rm -rf "$deb_root"
            mkdir -p "$install_root"

            core_publish_dir="${PUBLISH_DIRECTORY}/${TARGET_RUNTIME}"
            exclude_list="$(pwd)/core_excludes.txt"
            (cd "$core_publish_dir" && find . -type f -printf '%P\n') > "$exclude_list"
            rsync -a --exclude-from="$exclude_list" "$tfm_dir/" "$install_root/"
            rm -f "$exclude_list"

            find "$install_root" -mindepth 1 -maxdepth 1 -type d -name '??-??' -exec rm -rf {} +
            find "$install_root" -mindepth 1 -maxdepth 1 -type d -name '??' -exec rm -rf {} +

            extra_libs="$plugin_dir/extra-libs"
            if [ -d "$extra_libs" ]; then
              find "$extra_libs" -maxdepth 1 -type f -name '*.dll' -exec cp {} "$install_root/" \;
            fi

            app_dir="$plugin_dir/app"
            if [ -d "$app_dir" ]; then
              rm -rf "$install_root/app"
              cp -a "$app_dir" "$install_root/app"
            fi

            control_dir="$deb_root/DEBIAN"
            mkdir -p "$control_dir"
            installed_size=$(du -sk "$deb_root${PLUGINS_INSTALL_BASE}" | cut -f1)

            {
              echo "Package: ${deb_package}"
              echo "Version: ${plugin_version}"
              echo "Section: misc"
              echo "Priority: optional"
              echo "Architecture: ${DEB_ARCH}"
              echo "Maintainer: PINS Team"
              echo "Installed-Size: ${installed_size}"
              echo "Description: NINA plugin package for ${install_folder}"
            } > "$control_dir/control"

            {
              echo '#!/bin/sh'
              echo 'set -e'
              echo "chown ${SUDO_USER:-$USER}:${SUDO_USER:-$USER} $(dirname ${PLUGINS_INSTALL_BASE}) || true"
              echo "chown ${SUDO_USER:-$USER}:${SUDO_USER:-$USER} ${PLUGINS_INSTALL_BASE} || true"
              echo "chown -R ${SUDO_USER:-$USER}:${SUDO_USER:-$USER} \"${PLUGINS_INSTALL_BASE}/${install_folder}\" || true"
              echo 'exit 0'
            } > "$control_dir/postinst"
            chmod 755 "$control_dir/postinst"

            deb_path="${PLUGIN_ARTIFACT_DIR}/${deb_package}_${plugin_version}_${DEB_ARCH}_${RELEASE_DATE}.deb"
            dpkg-deb --root-owner-group --build "$deb_root" "$deb_path"
            sha256sum "$deb_path" > "$deb_path.sha256"

            echo "$deb_path" >> artifacts/release-files.txt
            echo "$deb_path.sha256" >> artifacts/release-files.txt
          }

          ensure_modern_libxisf_if_enabled() {
            if [ "${INDI_ENABLE_XISF}" != "true" ]; then
              return 0
            fi

            local has_required_api="false"
            local header_candidates=(
              "${LIBXISF_INSTALL_PREFIX}/include/libxisf.h"
              "/usr/local/include/libxisf.h"
              "/usr/include/libxisf.h"
            )

            local header
            for header in "${header_candidates[@]}"; do
              if [ -f "$header" ] && grep -q 'CompressionCodecSupported' "$header" && grep -q 'ZSTD' "$header"; then
                has_required_api="true"
                break
              fi
            done

            if [ "$has_required_api" = "true" ]; then
              return 0
            fi

            if [ "${LIBXISF_AUTO_UPGRADE_IF_OLD}" != "true" ]; then
              echo "LibXISF lacks required ZSTD API and auto-upgrade is disabled." >&2
              return 1
            fi

            rm -rf artifacts/src/libxisf
            mkdir -p artifacts/src
            git clone --depth 1 --branch "${LIBXISF_BRANCH}" "${LIBXISF_REPO_URL}" artifacts/src/libxisf

            cmake -S artifacts/src/libxisf -B artifacts/src/libxisf/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="${LIBXISF_INSTALL_PREFIX}" \
              -DUSE_BUNDLED_LIBS=ON \
              -DBUILD_SHARED_LIBS=ON
            cmake --build artifacts/src/libxisf/build --parallel "$(nproc)"
            sudo cmake --install artifacts/src/libxisf/build
            sudo ldconfig

            for header in "${header_candidates[@]}"; do
              if [ -f "$header" ] && grep -q 'CompressionCodecSupported' "$header" && grep -q 'ZSTD' "$header"; then
                return 0
              fi
            done

            echo "LibXISF upgrade completed but required API is still missing." >&2
            return 1
          }

          ensure_opencv_required_version() {
            local installed
            installed="$(pkg-config --modversion opencv4 2>/dev/null || true)"
            local required_major_minor
            required_major_minor="$(echo "${OPENCV_REQUIRED_VERSION}" | awk -F. '{print $1"."$2}')"

            if [[ "$installed" == "${OPENCV_REQUIRED_VERSION}" || "$installed" == "$required_major_minor"* ]]; then
              return 0
            fi

            rm -rf "${OPENCV_SOURCE_ROOT}"
            mkdir -p "${OPENCV_SOURCE_ROOT}"

            wget -O "${OPENCV_SOURCE_ROOT}/opencv-${OPENCV_REQUIRED_VERSION}.zip" "https://github.com/opencv/opencv/archive/refs/tags/${OPENCV_REQUIRED_VERSION}.zip"
            unzip -q "${OPENCV_SOURCE_ROOT}/opencv-${OPENCV_REQUIRED_VERSION}.zip" -d "${OPENCV_SOURCE_ROOT}"

            local cmake_args=(
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_INSTALL_PREFIX="${OPENCV_INSTALL_PREFIX}"
              -DOPENCV_GENERATE_PKGCONFIG=ON
            )

            if [ "${OPENCV_EXTRA_MODULES}" = "true" ]; then
              wget -O "${OPENCV_SOURCE_ROOT}/opencv_contrib-${OPENCV_REQUIRED_VERSION}.zip" "https://github.com/opencv/opencv_contrib/archive/refs/tags/${OPENCV_REQUIRED_VERSION}.zip"
              unzip -q "${OPENCV_SOURCE_ROOT}/opencv_contrib-${OPENCV_REQUIRED_VERSION}.zip" -d "${OPENCV_SOURCE_ROOT}"
              cmake_args+=("-DOPENCV_EXTRA_MODULES_PATH=${OPENCV_SOURCE_ROOT}/opencv_contrib-${OPENCV_REQUIRED_VERSION}/modules")
            fi

            cmake -S "${OPENCV_SOURCE_ROOT}/opencv-${OPENCV_REQUIRED_VERSION}" -B "${OPENCV_SOURCE_ROOT}/build-${OPENCV_REQUIRED_VERSION}" "${cmake_args[@]}"
            cmake --build "${OPENCV_SOURCE_ROOT}/build-${OPENCV_REQUIRED_VERSION}" --parallel "$(nproc)"
            sudo cmake --install "${OPENCV_SOURCE_ROOT}/build-${OPENCV_REQUIRED_VERSION}"
            sudo ldconfig

            export PKG_CONFIG_PATH="${OPENCV_INSTALL_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            export LD_LIBRARY_PATH="${OPENCV_INSTALL_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
            export CMAKE_PREFIX_PATH="${OPENCV_INSTALL_PREFIX}:${CMAKE_PREFIX_PATH:-}"
            export OpenCV_DIR="${OPENCV_INSTALL_PREFIX}/lib/cmake/opencv4"
          }

          configure_phd2_service_file() {
            local service_file="$1"
            local target_user="$2"
            local target_home="$3"
            [ -f "$service_file" ] || return

            sed -i \
              -e "s|^User=.*|User=${target_user}|" \
              -e "s|^Group=.*|Group=${target_user}|" \
              -e "s|^Environment=DISPLAY=.*|Environment=DISPLAY=:0|" \
              -e "s|^Environment=XAUTHORITY=.*|Environment=XAUTHORITY=${target_home}/.Xauthority|" \
              -e "s|^Environment=HOME=.*|Environment=HOME=${target_home}|" \
              -e "s|^WorkingDirectory=.*|WorkingDirectory=${target_home}|" \
              -e "s|^Restart=.*|Restart=on-failure|" \
              -e "s|/home/pi|${target_home}|g" \
              "$service_file"

            local tmp_service
            tmp_service="$(mktemp)"
            awk -v home="${target_home}" '
              /^ConditionPathExists=\/tmp\/\.X11-unix\/X0$/ { next }
              /^ConditionPathExists=.*\.Xauthority$/ { next }
              { print }
              $0 ~ /^After=.*graphical\.target/ {
                print "ConditionPathExists=/tmp/.X11-unix/X0"
                print "ConditionPathExists=" home "/.Xauthority"
              }
            ' "$service_file" > "$tmp_service"
            mv "$tmp_service" "$service_file"
          }

          build_phd2_package() {
            local target_user="${SUDO_USER:-$USER}"
            local target_home
            target_home="$(getent passwd "$target_user" | cut -d: -f6 || true)"
            if [ -z "$target_home" ]; then
              target_home="/home/$target_user"
            fi

            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              apt-transport-https \
              devscripts \
              equivs \
              debhelper \
              cdbs \
              dkms \
              fxload \
              libwxgtk3.2-dev \
              wx-common \
              wx3.2-i18n \
              libgtest-dev \
              libgmock-dev \
              libboost-all-dev \
              libeigen3-dev \
              libhidapi-dev \
              liblimesuite-dev \
              libopencv-dev \
              libv4l-dev \
              nlohmann-json3-dev \
              libwebp-dev \
              gettext \
              zlib1g-dev

            ensure_modern_libxisf_if_enabled

            local phd2_src="artifacts/src/phd2"
            rm -rf "$phd2_src"
            mkdir -p "$(dirname "$phd2_src")"
            git clone --branch "${PHD2_BRANCH}" --single-branch "${PHD2_REPO_URL}" "$phd2_src"

            local phd2_service_src
            for phd2_service_src in "$phd2_src/debian/phd2.service" "$phd2_src/debian/systemd/phd2.service"; do
              if [ -f "$phd2_service_src" ]; then
                configure_phd2_service_file "$phd2_service_src" "$target_user" "$target_home"
              fi
            done

            sudo bash -lc "set -euo pipefail; \
              if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then \
                sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources; \
              elif [ -f /etc/apt/sources.list.d/debian.sources ]; then \
                sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources; \
              elif [ -f /etc/apt/sources.list ]; then \
                sed -i '/^deb /p; s/^deb /deb-src /' /etc/apt/sources.list; \
              fi"
            sudo apt-get update

            local projects_home="${HOME}/Projects"
            mkdir -p "$projects_home" "$projects_home/build"

            local indi_core_src="$projects_home/indi-core"
            local indi_core_build="$projects_home/build/indi-core"
            rm -rf "$indi_core_src" "$indi_core_build"
            git clone --depth 1 --branch "v${PHD2_INDI_VERSION}" https://github.com/indilib/indi.git "$indi_core_src"
            cmake -S "$indi_core_src" -B "$indi_core_build" -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release
            cmake --build "$indi_core_build" --parallel "$(nproc)"
            sudo cmake --install "$indi_core_build"
            sudo ldconfig

            local equivs_dir="/tmp/libindi-dev-equivs"
            rm -rf "$equivs_dir"
            mkdir -p "$equivs_dir"
            {
              echo "Section: misc"
              echo "Priority: optional"
              echo "Standards-Version: 4.7.0"
              echo
              echo "Package: libindi-dev"
              echo "Version: ${PHD2_INDI_VERSION}"
              echo "Maintainer: Local Builder <builder@local>"
              echo "Architecture: all"
              echo "Description: Dummy libindi-dev package (local build)"
              echo " Dummy package to satisfy Build-Depends when INDI is built from source."
            } > "$equivs_dir/control"
            (
              cd "$equivs_dir"
              equivs-build control
            )
            sudo dpkg -i "$equivs_dir/libindi-dev_${PHD2_INDI_VERSION}_all.deb"

            (
              cd "$phd2_src"
              sudo mk-build-deps --install --remove \
                --tool "apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y" \
                debian/control
            )

            ensure_opencv_required_version

            if [ "${PHD2_BUILD_INDI_3RDPARTY}" = "true" ]; then
              local indi_3p_src="$projects_home/indi-3rdparty"
              local indi_3p_build="$projects_home/build/indi-3rdparty"
              rm -rf "$indi_3p_src" "$indi_3p_build"
              git clone --depth 1 --branch "v${PHD2_INDI_VERSION}" https://github.com/indilib/indi-3rdparty.git "$indi_3p_src"

              if cmake -S "$indi_3p_src" -B "$indi_3p_build" \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DCMAKE_BUILD_TYPE=Release \
                -DINDI_ROOT="${PHD2_INDI_ROOT}" \
                -DCMAKE_PREFIX_PATH="${PHD2_INDI_ROOT}:${CMAKE_PREFIX_PATH:-}"; then
                if cmake --build "$indi_3p_build" --parallel "$(nproc)"; then
                  sudo cmake --install "$indi_3p_build" || true
                  sudo ldconfig || true
                fi
              fi
            fi

            (
              cd "$phd2_src"

              local orig_version
              orig_version="$(sed -n '1s/^.*(\([^)]*\)).*/\1/p' debian/changelog)"
              if [ -z "$orig_version" ]; then
                echo "Unable to parse PHD2 debian/changelog version" >&2
                exit 1
              fi

              local base_version
              base_version="$(printf '%s' "$orig_version" | sed -E 's/-[A-Za-z0-9.+~]+$//')"
              local new_version
              new_version="${base_version}-$((30 + CI_BUILD_NUMBER))"

              export DEBEMAIL="builder@local"
              export DEBFULLNAME="Local Builder"
              dch --noauto-nmu -v "$new_version" "CI x64 build ${CI_BUILD_NUMBER}"

              export PKG_CONFIG_PATH="${OPENCV_INSTALL_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
              export LD_LIBRARY_PATH="${OPENCV_INSTALL_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
              export CMAKE_PREFIX_PATH="${OPENCV_INSTALL_PREFIX}:${CMAKE_PREFIX_PATH:-}"
              export OpenCV_DIR="${OPENCV_INSTALL_PREFIX}/lib/cmake/opencv4"
              export DEB_BUILD_OPTIONS="nocheck parallel=$(nproc)"

              dpkg-buildpackage -b -us -uc -a "${DEB_ARCH}"
            )

            mkdir -p artifacts
            find artifacts/src -maxdepth 3 -type f -name '*.deb' -path '*/phd2*' -exec cp -f {} artifacts/ \;

            local phd2_deb
            phd2_deb="$(find artifacts -maxdepth 1 -type f -name 'phd2_*_*.deb' ! -name '*dbgsym*' | sort | tail -n 1 || true)"
            if [ -z "$phd2_deb" ]; then
              echo "Failed to locate built PHD2 .deb artifact" >&2
              exit 1
            fi

            dpkg-deb -c "$phd2_deb" | tee /tmp/phd2-deb-contents.txt >/dev/null
            grep -q './etc/systemd/system/phd2.service' /tmp/phd2-deb-contents.txt || {
              echo "phd2.service missing inside package" >&2
              exit 1
            }

            sha256sum "$phd2_deb" > "$phd2_deb.sha256"
            echo "$phd2_deb" >> artifacts/release-files.txt
            echo "$phd2_deb.sha256" >> artifacts/release-files.txt
          }

          case "$package_key" in
            pins)
              build_pins_package
              ;;
            pinsdaemon)
              build_pinsdaemon_package
              ;;
            pins-wandereretasdk)
              build_wandereretasdk_package
              ;;
            pins-wanderercoversdk)
              build_wanderercoversdk_package
              ;;
            pins-wandererrotatorsdk)
              build_wandererrotatorsdk_package
              ;;
            pins-nitecrawlersdk)
              build_nitecrawlersdk_package
              ;;
            phd2)
              build_phd2_package
              ;;
            plugin-joko)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/joko.nina.plugins/Joko.NINA.Plugins/Joko.NINA.Plugins.HocusFocus/Joko.NINA.Plugins.HocusFocus.csproj" "joko.nina.plugins" "pins-plugin-joko" "" "no" "no"
              ;;
            plugin-orbitals)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/NINA.Joko.Plugin.Orbitals/NINA.Joko.Plugin.Orbitals/NINA.Joko.Plugin.Orbitals.csproj" "Orbitals" "pins-plugin-orbitals" "^\s*\[assembly:\s*AssemblyVersion" "no" "no"
              ;;
            plugin-tenmicron)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/NINA.Joko.Plugin.TenMicron/NINA.Joko.Plugin.TenMicron/NINA.Joko.Plugin.TenMicron.csproj" "NINA.Joko.Plugin.TenMicron" "pins-plugin-tenmicron" "^\s*\[assembly:\s*AssemblyVersion" "no" "no"
              ;;
            plugin-livestack)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/LiveStack/nina.plugin.livestack.csproj" "LiveStack" "pins-plugin-livestack" "" "no" "no"
              ;;
            plugin-ninaapi)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/ninaAPI/ninaAPI/ninaAPI.csproj" "ninaAPI" "pins-plugin-ninaapi" "" "no" "no"
              ;;
            plugin-orbuculum)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/nina.plugin.orbuculum/Orbuculum/Orbuculum.csproj" "Orbuculum" "pins-plugin-orbuculum" "^\s*\[assembly:\s*AssemblyVersion" "no" "no"
              ;;
            plugin-phd2tools)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/nina.plugin.phd2tools/nina.plugin.phd2tools.csproj" "Phd2 Tools" "pins-plugin-phd2tools" "^\s*\[assembly:\s*AssemblyVersion" "no" "no"
              ;;
            plugin-groundstation)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/nina-ground-station/Ground Station.csproj" "GroundStation" "pins-plugin-groundstation" "^\s*\[assembly:\s*AssemblyVersion" "no" "no"
              ;;
            plugin-alpaca)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/nina.plugin.alpaca/nina.plugin.alpaca.csproj" "Alpaca" "pins-plugin-alpaca" "" "no" "no"
              ;;
            plugin-nightsummary)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/nina.plugin.nightsummary/NINA.Plugin.NightSummary/NINA.Plugin.NightSummary.csproj" "NINA.Plugin.NightSummary" "pins-plugin-nightsummary" "" "no" "no"
              ;;
            plugin-polaralignment)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/PolarAlignment/PolarAlignment/NINA.Plugins.PolarAlignment.csproj" "PolarAlignment" "pins-plugin-polaralignment" "" "no" "no"
              ;;
            plugin-touch-n-stars)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/Touch-N-Stars/Touch-N-Stars/Touch-N-Stars.csproj" "Touch-N-Stars" "pins-plugin-touch-n-stars" "" "yes" "no"
              ;;
            plugin-pins)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/pins.plugin/PI'N'Stars.csproj" "pins.plugin" "pins-plugin-pins" "^\s*\[assembly:\s*AssemblyVersion" "no" "yes"
              ;;
            *)
              echo "Unsupported package key: $package_key" >&2
              exit 1
              ;;
          esac

          if [ ! -s artifacts/release-files.txt ]; then
            echo "No package artifacts found for $package_key" >&2
            exit 1
          fi

          {
            echo "release_files<<EOF"
            cat artifacts/release-files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish package GitHub release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: Release ${{ steps.meta.outputs.release_tag }}
          body: |
            Automated release for package ${{ inputs.package_key }}.
            Build number starts at 300 by using offset run numbering.
          files: ${{ steps.build.outputs.release_files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload package build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_key }}-debs
          path: ${{ steps.build.outputs.release_files }}
          retention-days: 30
