          project_path="NINA.Plugins/pins.plugin/PI'N'Stars.csproj"
          install_folder="pins.plugin"
          deb_package="pins-plugin-pins"
          plugin_dir=$(dirname "$project_path")
          # Convert plugin_dir to absolute path to avoid issues inside pushd/popd
          plugin_dir_abs="$(pwd)/$plugin_dir"
          
          set +e
          (
            set -euo pipefail

            # Build pins.powerbox.sdk
            echo "Building pins.powerbox.sdk..."
            powerbox_sdk_tmp="$(mktemp -d)"
            git clone --recursive https://github.com/nitr57/pins.powerbox.sdk "$powerbox_sdk_tmp"
            pushd "$powerbox_sdk_tmp" >/dev/null
            mkdir -p build && cd build
            cmake ..
            make
            mkdir -p "$plugin_dir_abs/extra-libs"
            echo "Listing build directory contents for pins.powerbox.sdk:"
            ls -l
            echo "Copying to $plugin_dir_abs/extra-libs/PowerBoxSDK.dll"
            # Use find to locate the .so file regardless of exact name prefix/suffix
            find . -name "libPowerBoxSDK.so" -exec cp {} "$plugin_dir_abs/extra-libs/PowerBoxSDK.dll" \;
            if [ ! -f "$plugin_dir_abs/extra-libs/PowerBoxSDK.dll" ]; then
                echo "Error: PowerBoxSDK.dll was not created!"
                exit 1
            fi
            popd >/dev/null
            rm -rf "$powerbox_sdk_tmp"

            # Build pins.meteostation.sdk
            echo "Building pins.meteostation.sdk..."
            meteostation_sdk_tmp="$(mktemp -d)"
            git clone --recursive https://github.com/nitr57/pins.meteostation.sdk "$meteostation_sdk_tmp"
            pushd "$meteostation_sdk_tmp" >/dev/null
            mkdir -p build && cd build
            cmake ..
            make
            mkdir -p "$plugin_dir_abs/extra-libs"
            echo "Listing build directory contents for pins.meteostation.sdk:"
            ls -l
            echo "Copying to $plugin_dir_abs/extra-libs/MeteoStationSDK.dll"
             # Use find to locate the .so file regardless of exact name prefix/suffix
            find . -name "libMeteoStationSDK.so" -exec cp {} "$plugin_dir_abs/extra-libs/MeteoStationSDK.dll" \;
            if [ ! -f "$plugin_dir_abs/extra-libs/MeteoStationSDK.dll" ]; then
                echo "Error: MeteoStationSDK.dll was not created!"
                exit 1
            fi
            popd >/dev/null
            rm -rf "$meteostation_sdk_tmp"

            assembly_info="$plugin_dir/Properties/AssemblyInfo.cs"
            if [ ! -f "$assembly_info" ]; then
              assembly_info=$(find "$plugin_dir" -name AssemblyInfo.cs | head -n 1)
            fi
            if [ -z "$assembly_info" ] || [ ! -f "$assembly_info" ]; then
              echo "AssemblyInfo.cs not found for $deb_package" >&2
              exit 1
            fi
            
            # Try robust grep first (for active attribute)
            assembly_version_line=$(grep -E '^\s*\[assembly:\s*AssemblyVersion' "$assembly_info" || true)
            # Fallback to loose grep if robust found nothing (e.g. commented out)
            if [ -z "$assembly_version_line" ]; then
                assembly_version_line=$(grep -E 'AssemblyVersion' "$assembly_info" || true)
            fi

            plugin_version=$(echo "$assembly_version_line" | sed -E 's/.*"([^\"]+)".*/\1/')
            if [ -z "$plugin_version" ]; then
              echo "AssemblyVersion not found in $assembly_info" >&2
              exit 1
            fi

