name: Build plugin packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        package_key:
          - plugin-alpaca
          - plugin-groundstation
          - plugin-joko
          - plugin-livestack
          - plugin-nightsummary
          - plugin-ninaapi
          - plugin-orbitals
          - plugin-orbuculum
          - plugin-phd2tools
          - plugin-pins
          - plugin-polaralignment
          - plugin-tenmicron
          - plugin-touch-n-stars
    uses: ./.github/workflows/build-single-package.yml
    with:
      package_key: ${{ matrix.package_key }}
